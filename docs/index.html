button{font:inherit;font-size:14px;font-weight:700;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
button.go{background:var(--fg);color:#000;border-color:var(--fg)}

// «H:MM:SS» o «MM:SS» → segons des de l'inici del set
const secs = s => { const p = s.split(':').map(Number); return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1]; };
const TM = String.raw`\d{1,2}:\d{2}(?::\d{2})?`;
const LINE = new RegExp(`^(${TM})(?:\\s*[-–]\\s*(${TM}))?\\s+(.+)$`);

// Setlist en text (el mateix format que les tasques de la Midnight App):

function parseSet(txt) {
  const parts = [], tracks = [];
  let part = null;
  for (const raw of txt.split('\n')) {
    const l = raw.trim();
    if (!l) continue;
    if (l.startsWith('#')) { part = { nom: l.replace(/^#+\s*/, ''), c: COL.rosa, n: 0 }; parts.push(part); continue; }
    const c = l.match(/^\[(\w+)\]$/);
    if (c) { if (part) part.c = COL[c[1]] || part.c; continue; }
    const m = l.match(LINE);
    if (!m) continue;
    if (!part) { part = { nom: '', c: COL.rosa, n: 0 }; parts.push(part); }
    let t = m[3].replace(/^\d+\.\s*/, '');           // treu el «12.» del davant
    const mk = t.match(/^([+-]\d)\s+/);              // «+1», «-2»: marca de l'ordre del DJ
    if (mk) t = t.slice(mk[0].length);
    tracks.push({ a: secs(m[1]), b: m[2] ? secs(m[2]) : null, t, mk: mk ? mk[1] : '', p: part, i: ++part.n });
  }
  tracks.forEach((x, i) => { if (x.b == null) x.b = tracks[i+1] ? tracks[i+1].a : x.a + 180; });
  parts.forEach(p => { const ts = tracks.filter(x => x.p === p); p.a = ts[0]?.a ?? 0; p.b = ts.at(-1)?.b ?? 0; });
  return { parts: parts.filter(p => p.n), tracks };
}

const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const hhmm = d => d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

$('nom').textContent = SET.nom || 'Universo Makina';
$('lloc').textContent = SET.lloc || '';
$('bar').innerHTML = parts.map(p => `<i style="width:${(p.b-p.a)/TOTAL*100}%;background:${p.c};opacity:.35" data-p></i>`).join('');
$('list').innerHTML = parts.map(p => `<div class="part-h" style="--c:${p.c}"><span>${esc(p.nom)}</span><span>${p.n} temas</span></div><ol>` +
  tracks.filter(x => x.p === p).map(x => `<li style="--c:${p.c}" data-i="${tracks.indexOf(x)}"><span class="t">${fmt(x.a)}</span><span>${x.mk ? `<b>${x.mk}</b> ` : ''}${esc(x.t)}</span></li>`).join('') + '</ol>').join('');
const lis = [...document.querySelectorAll('li[data-i]')];

let last = -2;
function tick() {
  const now = Date.now(), t0 = startAt(), el = (now - t0) / 1000;
  $('clock').textContent = hhmm(new Date(now));
  const i = tracks.findIndex(x => el >= x.a && el < x.b);
  const pct = Math.min(1, Math.max(0, el / TOTAL));
  $('done').textContent = el > 0 && el < TOTAL ? fmt(el) + ' de set' : '';
  $('rest').textContent = el > 0 && el < TOTAL ? 'quedan ' + fmt(TOTAL - el) : fmt(TOTAL) + ' en total';
  // barra de dalt: cada part es pinta plena fins on som
  [...$('bar').children].forEach((b, k) => { const p = parts[k]; b.style.opacity = el >= p.b ? 1 : el > p.a ? .35 + .65*(el-p.a)/(p.b-p.a) : .35; });

  if (el < 0) {
    $('main').innerHTML = `<div class="state">Empieza en ${fmt(-el)}<p>${new Date(t0).toLocaleString('es-ES',{weekday:'long',hour:'2-digit',minute:'2-digit'})} · ${tracks.length} temas · ${fmt(TOTAL)}</p></div>`;
  } else if (i < 0) {
    $('main').innerHTML = `<div class="state">Set terminado 🙌<p>${tracks.length} temas · ${fmt(TOTAL)}</p></div>`;
  } else {
    const x = tracks[i];
    document.documentElement.style.setProperty('--part', x.p.c);
    if (i !== last) $('main').innerHTML = `<div class="now"><div class="tag">${esc(x.p.nom)} · ${x.i}/${x.p.n}</div>
      <div class="title">${x.mk ? `<span class="mark">${x.mk}</span>` : ''}${esc(x.t)}</div>
      <div class="left" id="left"></div><div class="tbar"><i id="tb"></i></div></div>
      <h2>A continuación</h2><ol>${tracks.slice(i+1, i+4).map(n => `<li style="--c:${n.p.c}"><span class="t">${hhmm(new Date(t0 + n.a*1000))}</span><span>${n.mk ? `<b>${n.mk}</b> ` : ''}${esc(n.t)}</span></li>`).join('')}</ol>`;
    $('left').innerHTML = fmt(x.b - el) + '<small>para el siguiente</small>';
    $('tb').style.width = ((el - x.a) / (x.b - x.a) * 100) + '%';
  }
  if (i !== last) {
    lis.forEach((li, k) => { li.className = k < i || (i < 0 && el >= TOTAL) ? 'past' : k === i ? 'cur' : ''; });
    if (i >= 0 && last !== -2) lis[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    last = i;
  }
  $('sync').textContent = store.get() ? 'Sincronizado a mano: empieza a las ' + new Date(t0).toLocaleTimeString('es-ES') : planned ? 'Hora prevista del set' : '';
}

$('bStart').onclick = () => { store.set(Date.now()); last = -3; tick(); };
$('bMinus').onclick = () => { store.set(startAt() + 10000); last = -3; tick(); };   // el set va 10 s per darrere
$('bPlus').onclick  = () => { store.set(startAt() - 10000); last = -3; tick(); };
$('bReset').onclick = () => { store.set(0); last = -3; tick(); };
tick(); setInterval(tick, 500);
</script>
</body>
</html>
